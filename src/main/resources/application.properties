spring.application.name=hotel-booking
management.endpoints.web.exposure.include=health
springdoc.api-docs.path=/v3/api-docs
springdoc.info.title=Hotel Booking API
springdoc.info.version=1.0.0
springdoc.info.description=APIs for onboarding owners/properties, searching properties, and creating/paying/cancelling bookings. \
Typical flow: 1) POST /api/v1/owners to create an owner with properties and room types, \
2) GET /api/v1/properties/search or GET /api/v1/properties/{propertyId} to discover a propertyId/roomTypeId, \
3) POST /api/v1/bookings to create a booking using those ids, \
4) POST /api/v1/bookings/{bookingId}/payment to confirm it, \
5) optionally POST /api/v1/bookings/{bookingId}/cancel.
server.forward-headers-strategy=framework
server.port=${PORT:8080}
